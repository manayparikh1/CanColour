<body style="margin:9; 
font: 16px Arial, sans-serif;">
    <div style="padding:6px;background: #ddd4d4">
        <input type=color id=col valeu="#000000">
        <input id="hex" placeholder="#hex" size=7>

        <input type="range id=size" min=1 max=50 value=5>
        <button id="eraser">Eraser</button>
        <button id="clear">Clear</button>
    </div>
    <canvas id="c"></canvas>
    <script>
        let ctx = c.getContext('2d');
        c.width = innerWidth;
        c.height = innerHeight - 40;
        ctx.lineCap = 'round';
        let drawing = false;

        c.onpointerdown = function (e) { //basically controls the users mouse movements (and the code below)
            drawing = true;
            ctx.moveTo(e.offsetX, e.offsetY);
            ctx.beginPath();
        };
        c.pointermove = function (e) {
            if (!drawing) return;
            setStrokeStyle(col.value);
            ctx.lineWidth = size.value;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        };
        onpointerup = function () { drawing = false; };
        clear.onclick = function () { ctx.clearRect(0, 0, c.width, c.height); };
        hex.oninput = function () {
            if (/^#[0-9a-f]{6}$/i.test(hex.value)) col.value = hex.value;
        };

        col.oninput = function () { hex.value = col.value; };

        let erasing = false;
        eraser.onclick = function () {
            erasing = !erasing;
            eraser.textContent = erasing ? "Drawing" : "Eraser";
        };






    </script>
</body>
